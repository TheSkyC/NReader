# Modified for NReader by TheSkyC (2026); see NOTICE.
name: Release

on:
  push:
    tags:
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to publish'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6.1.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          expected="$(./gradlew -q :app:printNReaderVersion | tail -n 1)"
          if [ "$RELEASE_TAG" != "$expected" ]; then
            echo "Release tag $RELEASE_TAG does not match Gradle version $expected" >&2
            exit 1
          fi

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "${ANDROID_KEYSTORE_BASE64:?Missing keystore secret}" \
            | base64 --decode > "$RUNNER_TEMP/nreader-release.jks"
          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/nreader-release.jks"
            printf 'storePassword=%s\n' "${ANDROID_KEYSTORE_PASSWORD:?Missing keystore password secret}"
            printf 'keyAlias=%s\n' "${ANDROID_KEY_ALIAS:?Missing key alias secret}"
            printf 'keyPassword=%s\n' "${ANDROID_KEY_PASSWORD:?Missing key password secret}"
          } > keystore.properties

      - name: Assemble release APKs and bundle
        run: ./gradlew assembleRelease bundleMinApi28Release

      - name: Name release bundle
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          bundle_dir="app/build/outputs/bundle/minApi28Release"
          source="$bundle_dir/app-minApi28-release.aab"
          target="$bundle_dir/NReader-$RELEASE_TAG-minApi28-release.aab"
          if [ ! -f "$source" ]; then
            echo "Missing bundle: $source" >&2
            exit 1
          fi
          mv "$source" "$target"

      - name: Validate release artifacts
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          metadata="$(./gradlew -q :app:printNReaderMetadata)"
          version_name="$(awk -F= '$1 == "versionName" { print $2 }' <<< "$metadata")"
          version_code="$(awk -F= '$1 == "versionCode" { print $2 }' <<< "$metadata")"
          application_id="$(awk -F= '$1 == "applicationId" { print $2 }' <<< "$metadata")"
          apk_dir="app/build/outputs/apk/release"
          apk_min_api26="$apk_dir/NReader-$RELEASE_TAG-minApi26-release.apk"
          apk_min_api28="$apk_dir/NReader-$RELEASE_TAG-minApi28-release.apk"
          aab="app/build/outputs/bundle/minApi28Release/NReader-$RELEASE_TAG-minApi28-release.aab"
          aapt_bin="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          apksigner_bin="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          if [ -z "$aapt_bin" ] || [ -z "$apksigner_bin" ]; then
            echo 'Android build-tools are missing aapt or apksigner' >&2
            exit 1
          fi
          for artifact in "$apk_min_api26" "$apk_min_api28" "$aab"; do
            if [ ! -f "$artifact" ]; then
              echo "Missing expected artifact: $artifact" >&2
              exit 1
            fi
          done
          for apk in "$apk_min_api26" "$apk_min_api28"; do
            package_line="$("$aapt_bin" dump badging "$apk" | head -n 1)"
            expected_line="package: name='$application_id' versionCode='$version_code' versionName='$version_name'"
            if [[ "$package_line" != "$expected_line"* ]]; then
              echo "Unexpected APK metadata in $apk: $package_line" >&2
              exit 1
            fi
            "$apksigner_bin" verify --verbose "$apk"
          done
          jarsigner -verify "$aab" >/dev/null

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          metadata="$(./gradlew -q :app:printNReaderMetadata)"
          version_name="$(awk -F= '$1 == "versionName" { print $2 }' <<< "$metadata")"
          version_code="$(awk -F= '$1 == "versionCode" { print $2 }' <<< "$metadata")"
          application_id="$(awk -F= '$1 == "applicationId" { print $2 }' <<< "$metadata")"
          apk_dir="app/build/outputs/apk/release"
          apk_min_api26="$apk_dir/NReader-$RELEASE_TAG-minApi26-release.apk"
          apk_min_api28="$apk_dir/NReader-$RELEASE_TAG-minApi28-release.apk"
          assets=(app/build/outputs/apk/release/NReader-*.apk app/build/outputs/bundle/minApi28Release/*.aab)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo 'No release assets were produced' >&2
            exit 1
          fi
          : > SHA256SUMS.txt
          for asset in "${assets[@]}"; do
            digest="$(sha256sum "$asset" | awk '{ print $1 }')"
            printf '%s  %s\n' "$digest" "$(basename "$asset")" >> SHA256SUMS.txt
          done
          python scripts/build_update_manifest.py \
            --output nreader-update.json \
            --repository "${GITHUB_REPOSITORY}" \
            --tag "$RELEASE_TAG" \
            --version-name "$version_name" \
            --version-code "$version_code" \
            --package-name "$application_id" \
            --apk minApi26 26 "$apk_min_api26" \
            --apk minApi28 28 "$apk_min_api28"
          assets+=(SHA256SUMS.txt nreader-update.json)
          notes='Built and signed by the NReader GitHub Actions release workflow.'
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            gh release edit "$RELEASE_TAG" \
              --title "NReader $RELEASE_TAG" \
              --notes "$notes"
          elif [[ "$RELEASE_TAG" == *-* ]]; then
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --title "NReader $RELEASE_TAG" \
              --prerelease \
              --notes "$notes"
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --title "NReader $RELEASE_TAG" \
              --notes "$notes"
          fi
