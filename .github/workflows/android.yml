# Modified for NReader by TheSkyC (2026); see NOTICE.
name: Android CI

on:
    push:
        branches:
            - 'main'
    pull_request:
        branches:
            - '*'

jobs:
    tag-feeds:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            -   name: Checkout sources
                uses: actions/checkout@v7
                with:
                    persist-credentials: false

            -   name: Set up Python
                uses: actions/setup-python@v7
                with:
                    python-version: '3.14'

            -   name: Install script dependencies
                run: python -m pip install -r scripts/requirements.txt

            -   name: Test tag feed tools
                run: python -m unittest discover -s scripts/tests

            -   name: Verify the bundled catalog can be staged
                run: |
                    python -m scripts.build_tag_catalog --catalog data/tags.json --revision 1 --output "${RUNNER_TEMP}/tag-catalog-feed"
                    python -m scripts.verify_tag_feed --catalog-feed "${RUNNER_TEMP}/tag-catalog-feed"

            -   name: Verify a translation feed can be staged against the catalog
                run: |
                    python - <<'PY'
                    import json
                    import os
                    from pathlib import Path

                    catalog = json.loads(Path('data/tags.json').read_text(encoding='utf-8'))
                    source = Path(os.environ['RUNNER_TEMP']) / 'tag-translation-source.json'
                    source.write_text(json.dumps([
                        {'id': catalog[0][0], 'name': 'CI fixture translation', 'aliases': ['fixture alias']}
                    ], ensure_ascii=False), encoding='utf-8')
                    PY
                    python -m scripts.build_tag_translation_pack "${RUNNER_TEMP}/tag-translation-source.json" \
                        --locale ja --revision 1 --output "${RUNNER_TEMP}/tag-translation-pack.json"
                    python -m scripts.build_tag_translation_release "${RUNNER_TEMP}/tag-translation-pack.json" \
                        --catalog data/tags.json --output "${RUNNER_TEMP}/tag-translation-feed"
                    python -m scripts.verify_tag_feed \
                        --catalog-feed "${RUNNER_TEMP}/tag-catalog-feed" \
                        --translation-feed "${RUNNER_TEMP}/tag-translation-feed"

    build:
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout sources
                uses: actions/checkout@v7

            -   name: set up JDK 17
                uses: actions/setup-java@v6.1.0
                with:
                    java-version: '17'
                    distribution: 'temurin'
                    cache: gradle

            -   name: Grant execute permission for gradlew
                run: chmod +x gradlew

            -   name: Prepare pinned Unicode data for tag search
                run: |
                    TZ=Etc/GMT-14 ./gradlew --no-daemon --console plain :app:prepareTagUnicodeIcu --rerun-tasks
                    cp app/build/tag-unicode/icu4j.jar "${RUNNER_TEMP}/tag-unicode-utc-plus-14.jar"
                    TZ=Etc/GMT+12 ./gradlew --no-daemon --console plain :app:prepareTagUnicodeIcu --rerun-tasks
                    cmp "${RUNNER_TEMP}/tag-unicode-utc-plus-14.jar" app/build/tag-unicode/icu4j.jar
                    mkdir -p "${RUNNER_TEMP}/tag-unicode"
                    javac -cp app/build/tag-unicode/icu4j.jar -d "${RUNNER_TEMP}/tag-unicode" scripts/tests/TagUnicodeProbe.java
                    java -cp "app/build/tag-unicode/icu4j.jar:${RUNNER_TEMP}/tag-unicode" TagUnicodeProbe third_party/icu/LICENSE

            -   name: Check unsigned tag feed build guard
                run: |
                    set -euo pipefail
                    if ./gradlew --no-daemon --console plain \
                        -PnreaderTagCatalogManifestUrl=https://feed.example/tags/manifest.json help; then
                        echo 'Unsigned tag catalog feed configuration unexpectedly succeeded' >&2
                        exit 1
                    fi
                    if ./gradlew --no-daemon --console plain \
                        -PnreaderTagTranslationManifestUrl=https://feed.example/tags/manifest.json help; then
                        echo 'Unsigned tag translation feed configuration unexpectedly succeeded' >&2
                        exit 1
                    fi
                    ./gradlew --no-daemon --console plain \
                        -PnreaderTagCatalogManifestUrl=https://feed.example/tags/manifest.json \
                        -PnreaderEnableUnsignedTagFeeds=true help

            -   name: Assemble Debug with Gradle
                run: ./gradlew assembleDebug

            -   name: Bundle Debug with Gradle
                run: ./gradlew bundleDebug

            -   name: Upload Artifact
                uses: actions/upload-artifact@v7
                with:
                    name: Debug APKs
                    path: app/build/outputs/apk/
                    retention-days: 30
