name: Android CI

on:
    push:
        branches:
            - 'main'
    pull_request:
        branches:
            - '*'

jobs:
    tag-feeds:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            -   name: Checkout sources
                uses: actions/checkout@v7
                with:
                    persist-credentials: false

            -   name: Set up Python
                uses: actions/setup-python@v7
                with:
                    python-version: '3.13'

            -   name: Install script dependencies
                run: python -m pip install -r scripts/requirements.txt

            -   name: Test tag feed tools
                run: python -m unittest discover -s scripts/tests

            -   name: Verify the bundled catalog can be staged
                run: |
                    python -m scripts.build_tag_catalog --catalog data/tags.json --revision 1 --output "${RUNNER_TEMP}/tag-catalog-feed"
                    python -m scripts.verify_tag_feed --catalog-feed "${RUNNER_TEMP}/tag-catalog-feed"

    build:
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout sources
                uses: actions/checkout@v7

            -   name: set up JDK 17
                uses: actions/setup-java@v6.1.0
                with:
                    java-version: '17'
                    distribution: 'temurin'
                    cache: gradle

            -   name: Grant execute permission for gradlew
                run: chmod +x gradlew

            -   name: Assemble Debug with Gradle
                run: ./gradlew assembleDebug

            -   name: Bundle Debug with Gradle
                run: ./gradlew bundleDebug

            -   name: Upload Artifact
                uses: actions/upload-artifact@v7
                with:
                    name: Debug APKs
                    path: app/build/outputs/apk/
                    retention-days: 30
