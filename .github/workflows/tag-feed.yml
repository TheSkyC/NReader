# Modified for NReader by TheSkyC (2026); see NOTICE.
name: Publish Tag Catalog Feed

on:
  push:
    branches:
      - main
    paths:
      - data/tags.json
      - data/tagsVersion
      - scripts/build_tag_catalog.py
      - scripts/tag_catalog.py
      - scripts/verify_tag_feed.py
      - scripts/requirements.txt
      - .github/workflows/tag-feed.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install script dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Prepare feed worktree
        id: feed
        shell: bash
        run: |
          set -euo pipefail
          feed_root="$RUNNER_TEMP/nreader-tag-feed"
          git fetch origin tag-feed:refs/remotes/origin/tag-feed || true
          if git show-ref --verify --quiet refs/remotes/origin/tag-feed; then
            git worktree add "$feed_root" refs/remotes/origin/tag-feed
          else
            git worktree add --detach "$feed_root" HEAD
            git -C "$feed_root" checkout --orphan tag-feed
            git -C "$feed_root" rm -rf . || true
            git -C "$feed_root" clean -fdx
          fi
          mkdir -p "$feed_root/catalog"
          echo "root=$feed_root" >> "$GITHUB_OUTPUT"

      - name: Build and verify catalog feed
        id: catalog
        shell: bash
        run: |
          set -euo pipefail
          revision="$(tr -d '[:space:]' < data/tagsVersion)"
          python -m scripts.build_tag_catalog \
            --catalog data/tags.json \
            --revision "$revision" \
            --output "${{ steps.feed.outputs.root }}/catalog"
          python -m scripts.verify_tag_feed \
            --catalog-feed "${{ steps.feed.outputs.root }}/catalog"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Publish immutable payload and manifest pointer
        shell: bash
        env:
          FEED_ROOT: ${{ steps.feed.outputs.root }}
          REVISION: ${{ steps.catalog.outputs.revision }}
        run: |
          set -euo pipefail
          git -C "$FEED_ROOT" config user.name "github-actions[bot]"
          git -C "$FEED_ROOT" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$FEED_ROOT" add catalog
          if git -C "$FEED_ROOT" diff --cached --quiet; then
            echo "Catalog revision $REVISION is already published"
            exit 0
          fi
          git -C "$FEED_ROOT" commit -m "data(tags): publish catalog revision $REVISION"
          git -C "$FEED_ROOT" push origin HEAD:refs/heads/tag-feed

      - name: Remove feed worktree
        if: always()
        shell: bash
        run: git worktree remove --force "${{ steps.feed.outputs.root }}" || true
