# Modified for NReader by TheSkyC (2026); see NOTICE.
name: Publish Tag Catalog Feed

on:
  push:
    branches:
      - main
    paths:
      - data/tags.json
      - data/tagsVersion
      - scripts/build_tag_catalog.py
      - scripts/tag_catalog.py
      - scripts/verify_tag_feed.py
      - scripts/requirements.txt
      - .github/workflows/tag-feed.yml
  workflow_dispatch:

concurrency:
  group: tag-catalog-feed
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install script dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Prepare feed directory
        id: feed
        shell: bash
        run: |
          set -euo pipefail
          feed_root="$GITHUB_WORKSPACE/feed/catalog"
          rm -rf "$feed_root/catalog"
          mkdir -p "$feed_root"
          echo "root=$feed_root" >> "$GITHUB_OUTPUT"

      - name: Build and verify catalog feed
        id: catalog
        shell: bash
        run: |
          set -euo pipefail
          revision="$(tr -d '[:space:]' < data/tagsVersion)"
          python -m scripts.build_tag_catalog \
            --catalog data/tags.json \
            --revision "$revision" \
            --output "${{ steps.feed.outputs.root }}"
          python -m scripts.verify_tag_feed \
            --catalog-feed "${{ steps.feed.outputs.root }}"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Publish immutable payload and manifest pointer
        shell: bash
        env:
          FEED_ROOT: ${{ steps.feed.outputs.root }}
          REVISION: ${{ steps.catalog.outputs.revision }}
        run: |
          set -euo pipefail
          git -C "$FEED_ROOT" config user.name "github-actions[bot]"
          git -C "$FEED_ROOT" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed/catalog
          if git diff --cached --quiet; then
            echo "Catalog revision $REVISION is already published"
            exit 0
          fi
          git commit -m "data(tags): publish catalog revision $REVISION"
          git push origin HEAD:main
