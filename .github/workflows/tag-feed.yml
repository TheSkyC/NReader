# Modified for NReader by TheSkyC (2026); see NOTICE.
name: Publish Signed Tag Feeds

on:
  push:
    branches:
      - main
    paths:
      - data/tags.json
      - data/tagsVersion
      - feed/translations/**
      - scripts/build_tag_catalog.py
      - scripts/tag_catalog.py
      - scripts/build_tag_translation_release.py
      - scripts/build_tag_translation_pack.py
      - scripts/verify_tag_feed.py
      - scripts/sign_tag_feed.py
      - scripts/publish_signed_tag_feeds.py
      - scripts/requirements.txt
      - scripts/requirements-signing.txt
      - .github/workflows/tag-feed.yml
  workflow_dispatch:

concurrency:
  group: tag-catalog-feed
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install script dependencies
        run: python -m pip install -r scripts/requirements.txt -r scripts/requirements-signing.txt

      - name: Prepare feed directory
        id: feed
        shell: bash
        run: |
          set -euo pipefail
          feed_root="$GITHUB_WORKSPACE/feed/catalog"
          translation_root="$GITHUB_WORKSPACE/feed/translations"
          rm -rf "$feed_root/catalog"
          mkdir -p "$feed_root" "$translation_root"
          echo "root=$feed_root" >> "$GITHUB_OUTPUT"
          echo "translation_root=$translation_root" >> "$GITHUB_OUTPUT"

      - name: Build and verify catalog feed
        id: catalog
        shell: bash
        run: |
          set -euo pipefail
          revision="$(tr -d '[:space:]' < data/tagsVersion)"
          python -m scripts.build_tag_catalog \
            --catalog data/tags.json \
            --revision "$revision" \
            --output "${{ steps.feed.outputs.root }}"
          python -m scripts.verify_tag_feed \
            --catalog-feed "${{ steps.feed.outputs.root }}" \
            --translation-feed "${{ steps.feed.outputs.translation_root }}"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Sign verified feed manifests
        env:
          NREADER_FEED_SIGNING_KEY: ${{ secrets.NREADER_FEED_SIGNING_KEY }}
        run: >-
          python -m scripts.publish_signed_tag_feeds
          --catalog-feed "${{ steps.feed.outputs.root }}"
          --translation-feed "${{ steps.feed.outputs.translation_root }}"

      - name: Publish immutable payloads and manifest pointers
        shell: bash
        env:
          FEED_ROOT: ${{ steps.feed.outputs.root }}
          REVISION: ${{ steps.catalog.outputs.revision }}
        run: |
          set -euo pipefail
          git -C "$FEED_ROOT" config user.name "github-actions[bot]"
          git -C "$FEED_ROOT" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed/catalog feed/translations
          if git diff --cached --quiet; then
            echo "Catalog revision $REVISION is already published"
            exit 0
          fi
          base="$(git rev-parse HEAD)"
          git commit -m "data(tags): publish catalog revision $REVISION"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            if ! git diff --quiet "$base" FETCH_HEAD -- data feed scripts .github/workflows/tag-feed.yml; then
              echo 'Feed inputs changed concurrently; rerun publication against main' >&2
              exit 1
            fi
            base="$(git rev-parse FETCH_HEAD)"
            git rebase "$base"
          done
          echo 'Could not publish after three attempts; rerun the workflow' >&2
          exit 1
